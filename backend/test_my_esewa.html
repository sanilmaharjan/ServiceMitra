<!DOCTYPE html>
<html>
<head>
    <title>Test Payment</title>
</head>
<body>
    <h2>Test 3-Layer Payment</h2>
    
    <h3>Step 1: Pay 20% Advance (Rs. 200 for Rs. 1000 job)</h3>
    <form action="https://rc-epay.esewa.com.np/api/epay/main/v2/form" method="POST">
        <input type="hidden" name="amount" value="200">
        <input type="hidden" name="tax_amount" value="0">
        <input type="hidden" name="total_amount" value="200">
        <input type="hidden" name="transaction_uuid" value="ADV123456789">
        <input type="hidden" name="product_code" value="EPAYTEST">
        <input type="hidden" name="product_service_charge" value="0">
        <input type="hidden" name="product_delivery_charge" value="0">
        <input type="hidden" name="success_url" value="http://127.0.0.1:8000/api/payment/esewa-success/advance/">
        <input type="hidden" name="failure_url" value="http://127.0.0.1:8000/api/payment/esewa-failure/">
        <input type="hidden" name="signed_field_names" value="total_amount,transaction_uuid,product_code">
        <input type="hidden" name="signature" value="H4IjKvX7YjK8xV5jM9pLqR2sT3uV4wX5yZ6aB7cD8eF9gH0iJ1kL2mN3oP4qR5sT6uV7wX8yZ9">
        <button type="submit">Pay 20% Advance (Rs. 200)</button>
    </form>
    
    <h3>Step 2: Pay 80% Final (Rs. 800 for Rs. 1000 job)</h3>
    <form action="https://rc-epay.esewa.com.np/api/epay/main/v2/form" method="POST">
        <input type="hidden" name="amount" value="800">
        <input type="hidden" name="tax_amount" value="0">
        <input type="hidden" name="total_amount" value="800">
        <input type="hidden" name="transaction_uuid" value="FNL123456789">
        <input type="hidden" name="product_code" value="EPAYTEST">
        <input type="hidden" name="product_service_charge" value="0">
        <input type="hidden" name="product_delivery_charge" value="0">
        <input type="hidden" name="success_url" value="http://127.0.0.1:8000/api/payment/esewa-success/final/">
        <input type="hidden" name="failure_url" value="http://127.0.0.1:8000/api/payment/esewa-failure/">
        <input type="hidden" name="signed_field_names" value="total_amount,transaction_uuid,product_code">
        <input type="hidden" name="signature" value="H4IjKvX7YjK8xV5jM9pLqR2sT3uV4wX5yZ6aB7cD8eF9gH0iJ1kL2mN3oP4qR5sT6uV7wX8yZ9">
        <button type="submit">Pay 80% Final (Rs. 800)</button>
    </form>
</body>
</html>
